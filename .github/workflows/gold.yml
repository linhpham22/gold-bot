name: Gold price bot

on:
  schedule:
    # BAN TIN day du - gio VN = UTC+7: 8h00 VN = 1h00 UTC, 17h00 VN = 10h00 UTC
    - cron: '0 1,10 * * *'
    # BAN TIN 12h30 VN = 5h30 UTC
    - cron: '30 5 * * *'
    # CANH BAO bien dong +-500k: moi gio tu 7h15 den 22h15 VN (= 0h15-15h15 UTC)
    - cron: '15 0-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Xac dinh che do (ban tin / canh bao)
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "15 0-15 * * *" ]; then
            echo "mode=alert" >> "$GITHUB_OUTPUT"
          else
            echo "mode=bulletin" >> "$GITHUB_OUTPUT"
          fi

      - name: Lay gia vang
        run: node fetch.js

      - name: Gui Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
          ALERT_THRESHOLD: '500000'
        run: node send.js ${{ steps.mode.outputs.mode }}

      - name: Luu du lieu vao repo
        run: |
          git config user.name "gold-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/history.json docs/latest.json docs/state.json
          git diff --cached --quiet || git commit -m "cap nhat gia vang (${{ steps.mode.outputs.mode }})"
          git pull --rebase origin main || true
          git push
